<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register</title>
    </head>
    <body>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                box-sizing: border-box;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #333;
                background-image: url("text-decoration none;.png");
                background-size: 112.5% auto !important;
                background-repeat: no-repeat;
                background-position: center;
                background-size: contain;
                background-attachment: fixed;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                color: #eee;
            }

            .container {
                width: 850px;
                max-width: calc(100% - 60px);
                padding: 20px;
                background-color: rgba(34, 34, 34, 0.95);
                border-radius: 25px;
                box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
            }

            h1 {
                font-size: 32px;
                margin-top: 0;
                margin-bottom: 10px;
                color: #e10600;
                text-align: center;
                border-bottom: 4px solid;
                padding-bottom: 20px;
            }

            .intro {
                text-align: center;
                font-size: 14px;
                margin-top: 0;
                margin-bottom: -20px;
            }
            h2 {
                font-size: 16px;
                color: #fff;
                border-bottom: 4px solid #e10600;
                padding: 3px;
                margin-top: 20px;
                margin-bottom: 10px;
                color: #e10600;
            }
            input {
                border-radius: 15px;
                background-color: #e10600;
                border: none;
                color: #fff;
                padding: 5px;
                padding-top: 2.5px;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            input::placeholder {
                color: #fff;
            }
            input:focus {
                outline: 2px solid #fff;
            }
            input:focus::placeholder {
                color: transparent;
            }
            input::-ms-reveal {
                filter: brightness(0) invert(1);
            }
            .flexer {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 15px;
            }
            .confirmButton {
                display: block;
                width: 200px;
                margin: 25px auto 0;
                padding: 12px;
                background-color: #e10600;
                color: #fff;
                border: none;
                border-radius: 25px;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-size: 16px;
                cursor: pointer;
                transition: background-color 0.2s;
            }

            .confirmButton:hover {
                background-color: #ff3333;
            }

            .confirmButton:focus-visible {
                outline: 2px solid #fff;
                outline-offset: 3px;
            }
        </style>
        <div class="container">
            <h1>Register</h1>
            <p class="intro" style="padding-top: 15px;">Create your account below</p>

            <form>
                <h2>Name</h2>
                <div class="flexer">
                    <input type="text" id="Firstname" name="Firstname" placeholder="Firstname" required>
                    <input type="text" id="Surname" name="Surname" placeholder="Surname" required>
                </div>
                <h2>Email</h2>
                <div class="flexer">
                    <input type="email" id="Email" name="Email" placeholder="Email" required>
                    <input type="email" id="ConfirmEmail" name="ConfirmEmail" placeholder="Confirm Email" required>
                </div>
                <h2>Password</h2>
                <div class="flexer">
                    <input type="password" id="Password" name="Password" placeholder="Password" required>
                    <input type="password" id="ConfirmPassword" name="ConfirmPassword" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="confirmButton">Confirm</button>
            </form>
        </div>
        <script>
            const form = document.querySelector("form")

            const email = document.getElementById("Email")
            const confirmEmail= document.getElementById("ConfirmEmail")

            const password = document.getElementById("Password")
            const confirmPassword = document.getElementById("ConfirmPassword")

            form.addEventListener("submit", function(event) {
                event.preventDefault()

                if (email.value.trim() !== confirmEmail.value.trim()) {
                    alert("Your email addresses do not match!");
                    confirmEmail.focus();
                    return;
                }
                if (password.value !== confirmPassword.value) {
                    alert("Your passwords do not match!");
                    confirmPassword.focus();
                    return;
                }
                
                alert("All details are valid!");

                form.reset();
            })
        </script>
    </body>
</html>
