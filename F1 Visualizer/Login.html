<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
    </head>
    
        <style>
            @font-face {
                font-family: 'Formula1-Bold';
                src: url('Formula1-Bold.woff2') format('woff2');
                font-weight: 700;
                font-style: normal;
            }
            @font-face {
                font-family: 'Formula1-Regular';
                src: url('Formula1-Regular.woff2') format('woff2');
                font-weight: 400;
                font-style: normal;
            }
            @font-face {
                font-family: 'Formula1-Regular-Bold';
                src: url('Formula1-Regular.woff2') format('woff2');
                font-style: normal;
            }
            body {
                background-color: #f7f4f1;
                margin: 0px;
                font-family: sans-serif;
            }
            header {
                background-color: #15151d;
            }
            .logo {
                margin: 41px;
                width: 200px;
            }
            .options {
                display: flex;
                gap: 10px;
                background-color: #38383f;
                min-height: 47px;
                justify-content: center;
            }
            button {
                outline: none;
                background-color: transparent;
                border: none;
                color: #ffffff;
                cursor: pointer;
                border-top: 4px solid transparent;
                border-bottom: 4px solid transparent;
                padding: 12px;
                padding-left: 24px;
                padding-right: 24px;
                font-size: 15px;
            }
            .current {
                border-bottom: 4px solid #df2904;
                font-family: 'Formula1-Regular-Bold',sans-serif;
                font-size: 15px;
                font-weight: 900;
                letter-spacing: 1.2px;
            }
            .inactive {
                border-bottom: 4px solid transparent;
                font-family: 'Formula1-Regular',sans-serif;
                font-size: 15px;
            }
            .inactive:hover {
                border-bottom: 4px solid #fff;
            }
            h1 {
                color: #333;
                text-transform: uppercase;
                font-family: 'Formula1-Bold';
                font-weight: 700;
                letter-spacing: 1.2px;
            }
        </style>
    <body>
        <header><a href="index.html"><img src="f1_logo.svg" alt="logo" class="logo"></a></header>
        <section class="options">
            <button class="current">Sign In</button>
            <a href="Register.html"><button class="inactive">Register</button></a>
        </section>
        <h1>Sign In</h1>
    </body>
</html>
